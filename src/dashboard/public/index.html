<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>m8m — Memory Observatory</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" class="brand-logo" alt="" />
      m8m
      <span class="tagline">memory observatory</span>
    </div>
    <nav class="tabs" aria-label="Dashboard views">
      <a class="tab" data-view="timeline" href="#/timeline" aria-current="page">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />
        </svg>
        Timeline
      </a>
      <a class="tab" data-view="memories" href="#/memories">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" />
        </svg>
        Memories
      </a>
      <a class="tab" data-view="security" href="#/security">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        Security
      </a>
      <a class="tab" data-view="diff" href="#/diff">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="18" r="3" /><circle cx="6" cy="6" r="3" /><path d="M13 6h3a2 2 0 0 1 2 2v7" /><path d="M11 18H8a2 2 0 0 1-2-2V9" />
        </svg>
        Diff
      </a>
    </nav>
    <div class="stats-bar" id="stats-bar" hidden></div>
  </header>

  <main id="app" class="container"></main>
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <button class="help-btn" type="button" id="help-btn" aria-haspopup="dialog" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>

  <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
    <h2 id="help-title">Keyboard shortcuts</h2>
    <dl class="help-list">
      <div><dt><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></dt><dd>Timeline, Memories, Security, Diff</dd></div>
      <div><dt><kbd>r</kbd></dt><dd>Refresh the current view</dd></div>
      <div><dt><kbd>s</kbd></dt><dd>Focus the search box</dd></div>
      <div><dt><kbd>?</kbd></dt><dd>Show this list</dd></div>
      <div><dt><kbd>Esc</kbd></dt><dd>Close this list, or leave the search box</dd></div>
    </dl>
    <form method="dialog"><button class="btn ghost" type="submit">Close</button></form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
