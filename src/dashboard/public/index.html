<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>m8m — Memory Observatory</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="logo.png" class="brand-logo" alt="m8m" /> m8m <span class="tagline">memory observatory</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="overview">Overview</button>
      <button class="tab" data-view="constellation">Constellation</button>
      <button class="tab" data-view="river">River</button>
      <button class="tab" data-view="heatmap">Heatmap</button>
      <button class="tab" data-view="security">Radar</button>
      <button class="tab" data-view="diff">Butterfly</button>
      <button class="tab" data-view="decay">Decay</button>
    </nav>
  </header>
  <main id="app" class="container"></main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
