<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M8m — Memory Observatory</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="logo.png" class="brand-logo" alt="M8m" /> M8m <span class="tagline">memory observatory</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="timeline">Timeline</button>
      <button class="tab" data-view="memories">Memories</button>
      <button class="tab" data-view="security">Security</button>
      <button class="tab" data-view="diff">Diff</button>
    </nav>
  </header>
  <main id="app" class="container"></main>
  <script src="app.js"></script>
</body>
</html>
